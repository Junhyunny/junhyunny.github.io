<div class="book-cards{% if include.variant %} book-cards--{{ include.variant }}{% endif %}">
    <article class="book-card">
        <a class="book-card__link" href="https://www.yes24.com/product/goods/180391041">
            <div class="book-card__cover">
                <img
                    src="{{ '/images/profile/spring-security-book.png' | relative_url }}"
                    alt="안쪽까지 들여다보는 스프링 시큐리티 표지"
                    width="1138"
                    height="338"
                    loading="lazy"
                >
            </div>
            <div class="book-card__content">
                <span class="book-card__eyebrow">{% if include.variant == "profile" %}MY BOOK{% else %}BOOK{% endif %}</span>
                <span class="book-card__title">안쪽까지 들여다보는 스프링 시큐리티</span>
                <span class="book-card__author">강준현 지음</span>
                <span class="book-card__action">
                    책 보러 가기
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </span>
            </div>
        </a>
    </article>
</div>
